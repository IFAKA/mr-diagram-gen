[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mr-diagram-gen"
version = "0.1.0"
description = "Language-agnostic CLI tool that generates Mermaid diagrams for MRs/PRs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MR Diagram Generator" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
    "python-gitlab>=4.0.0",
    "PyGithub>=2.0.0",
    "ollama>=0.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
mr-diagram-gen = "mr_diagram_gen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mr_diagram_gen"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=mr_diagram_gen"
